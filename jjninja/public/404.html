<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>404 ~ Janine Jay</title>
  <style>
    * {
      font-family: Courier New, Courier, monospace;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #FBEEB2;
      color: #364659;
    }

    main {
      max-width: 40rem;
      padding: 2rem;
    }

    h1 {
      font-size: 4rem;
      margin: 0;
    }

    pre {
      padding: 1rem;
      border-radius: 0.375rem;
      background-color: #3d4260;
      color: #ffffff;
      white-space: pre-wrap;
    }

    .keyword {
      color: #ff8fc0;
    }

    .function {
      color: #7cf07c;
    }

    .comment {
      color: #b9bdd0;
    }

    a {
      color: #364659;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main>
    <h1>404</h1>
    <p>The ninja vanished. So did this page.</p>
    <pre><span class="keyword">try</span> {
    page = <span class="function">find</span>(location.pathname);
} <span class="keyword">catch</span> (SmokeBomb e) {
    <span class="comment">// nothing here but a puff of smoke</span>
    <span class="function">goHome</span>();
}</pre>
    <p><a href="/">goHome()</a></p>
  </main>
</body>

</html>
